<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Bayes updates prior belief with evidence">
  <rect width="720" height="420" fill="#f8fafc"/>
  <rect x="60" y="145" width="160" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <rect x="280" y="145" width="160" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <rect x="500" y="145" width="160" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <path d="M220 190 L280 190" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M440 190 L500 190" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="104" y="183" font-family="Arial, sans-serif" font-size="24" fill="#0f172a">Prior</text>
  <text x="89" y="213" font-family="Arial, sans-serif" font-size="18" fill="#475569">P(A)</text>
  <text x="318" y="183" font-family="Arial, sans-serif" font-size="24" fill="#0f172a">Evidence</text>
  <text x="328" y="213" font-family="Arial, sans-serif" font-size="18" fill="#475569">B xảy ra</text>
  <text x="536" y="183" font-family="Arial, sans-serif" font-size="24" fill="#0f172a">Posterior</text>
  <text x="548" y="213" font-family="Arial, sans-serif" font-size="18" fill="#475569">P(A | B)</text>
  <text x="86" y="315" font-family="Arial, sans-serif" font-size="24" fill="#0f172a">Bayes = cập nhật niềm tin sau khi có bằng chứng mới</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>

