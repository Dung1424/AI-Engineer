<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Linear regression fits a line through data points">
  <rect width="720" height="420" fill="#f8fafc"/>
  <line x1="80" y1="340" x2="640" y2="340" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="360" x2="120" y2="60" stroke="#334155" stroke-width="2"/>
  <line x1="140" y1="300" x2="600" y2="110" stroke="#2563eb" stroke-width="5"/>
  <g fill="#dc2626">
    <circle cx="185" cy="285" r="9"/>
    <circle cx="285" cy="250" r="9"/>
    <circle cx="385" cy="180" r="9"/>
    <circle cx="505" cy="145" r="9"/>
  </g>
  <g stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 7">
    <line x1="185" y1="285" x2="185" y2="281"/>
    <line x1="285" y1="250" x2="285" y2="241"/>
    <line x1="385" y1="180" x2="385" y2="199"/>
    <line x1="505" y1="145" x2="505" y2="149"/>
  </g>
  <text x="235" y="72" font-family="Arial, sans-serif" font-size="25" fill="#0f172a">y = w*x + b</text>
  <text x="160" y="385" font-family="Arial, sans-serif" font-size="22" fill="#475569">gradient descent sửa w và b để đường thẳng gần điểm hơn</text>
</svg>

