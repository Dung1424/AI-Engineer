<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Mean median variance and spread">
  <rect width="720" height="420" fill="#f8fafc"/>
  <line x1="80" y1="320" x2="640" y2="320" stroke="#334155" stroke-width="2"/>
  <g fill="#2563eb">
    <circle cx="170" cy="320" r="8"/>
    <circle cx="250" cy="320" r="8"/>
    <circle cx="330" cy="320" r="8"/>
    <circle cx="410" cy="320" r="8"/>
    <circle cx="490" cy="320" r="8"/>
  </g>
  <line x1="330" y1="85" x2="330" y2="335" stroke="#dc2626" stroke-width="4"/>
  <text x="282" y="70" font-family="Arial, sans-serif" font-size="24" fill="#dc2626">mean = median</text>
  <path d="M170 250 C250 160 410 160 490 250" stroke="#16a34a" stroke-width="5" fill="none"/>
  <text x="185" y="190" font-family="Arial, sans-serif" font-size="22" fill="#15803d">độ phân tán / variance</text>
  <text x="78" y="365" font-family="Arial, sans-serif" font-size="20" fill="#475569">dữ liệu nằm quanh trung tâm và phân tán ra hai bên</text>
</svg>

